<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to Text</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
            font-size: 1.5rem;
        }

        .upload-area {
            background: white;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .upload-area:hover {
            border-color: #007bff;
            background-color: #f8f9fa;
        }

        .upload-area.dragover {
            border-color: #007bff;
            background-color: #e7f1ff;
        }

        .upload-label {
            display: block;
            color: #666;
            font-size: 1rem;
        }

        .file-input {
            display: none;
        }

        .content-area {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            min-height: 200px;
            max-height: 400px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            color: #333;
        }

        .content-area.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .copy-btn {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: #0056b3;
        }

        .copy-btn:active {
            background-color: #004085;
        }

        .copy-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .copy-btn.copied {
            background-color: #28a745;
        }

        .file-name {
            margin-top: 8px;
            font-size: 0.875rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSV to Text</h1>
        
        <div class="upload-area" id="uploadArea">
            <label class="upload-label" for="fileInput">
                Tap to select or drag a CSV file here
            </label>
            <input type="file" id="fileInput" class="file-input" accept=".csv,text/csv">
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="content-area empty" id="contentArea">
            CSV content will appear here
        </div>

        <button class="copy-btn" id="copyBtn" disabled>
            Copy to Clipboard
        </button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const contentArea = document.getElementById('contentArea');
        const copyBtn = document.getElementById('copyBtn');
        
        let csvContent = '';

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // Drag and drop support
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.csv') && file.type !== 'text/csv') {
                alert('Please select a CSV file');
                return;
            }

            fileName.textContent = file.name;

            const reader = new FileReader();
            reader.onload = (e) => {
                csvContent = e.target.result;
                displayContent(csvContent);
            };
            reader.readAsText(file);
        }

        function displayContent(content) {
            contentArea.textContent = content;
            contentArea.classList.remove('empty');
            copyBtn.disabled = false;
        }

        // Copy to clipboard
        copyBtn.addEventListener('click', async () => {
            if (!csvContent) return;

            try {
                await navigator.clipboard.writeText(csvContent);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy to Clipboard';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = csvContent;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy to Clipboard';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }
        });
    </script>
</body>
</html>
